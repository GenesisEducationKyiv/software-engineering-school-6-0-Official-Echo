services:
    ghchk:
        build: .
        ports:
            - "3000:3000"
            - "50051:50051"
        volumes:
            - db_data:/app/data
        environment:
            PORT: 3000
            GRPC_PORT: 50051
            DB_PATH: /app/data/app.db
            BASE_URL: ${BASE_URL:-http://localhost:3000}
            CRON_SCHEDULE: ${CRON_SCHEDULE:-"*/15 * * * *"}
            GITHUB_TOKEN: ${GITHUB_TOKEN:-}
            REDIS_URL: redis://redis:6379
            KAFKA_BROKERS: kafka:9092
            KAFKA_CLIENT_ID: ghchk
            API_KEY: ${API_KEY:-}
            SMTP_HOST: ${SMTP_HOST:-}
            SMTP_PORT: ${SMTP_PORT:-587}
            SMTP_SECURE: ${SMTP_SECURE:-false}
            SMTP_USER: ${SMTP_USER:-}
            SMTP_PASS: ${SMTP_PASS:-}
            SMTP_FROM: ${SMTP_FROM:-noreply@github-notifier.dev}
            LOG_LEVEL: ${LOG_LEVEL:-info}
            ELASTICSEARCH_URL: http://elasticsearch:9200
            ELASTICSEARCH_INDEX: ghchk-logs
        depends_on:
            kafka:
                condition: service_healthy
            elasticsearch:
                condition: service_healthy
            redis:
                condition: service_started
        restart: unless-stopped

    kafka:
        image: apache/kafka:4.2.1
        ports:
            - "9092:9092"
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        volumes:
            - kafka_data:/var/lib/kafka/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1",
                ]
            interval: 10s
            timeout: 10s
            retries: 15
            start_period: 20s
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        volumes:
            - redis_data:/data

    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
        environment:
            - discovery.type=single-node
            - xpack.security.enabled=false
            - ES_JAVA_OPTS=-Xms512m -Xmx512m
        ports:
            - "9200:9200"
        volumes:
            - es_data:/usr/share/elasticsearch/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    'curl -sf http://localhost:9200/_cluster/health | grep -v ''\"status\":\"red\"''',
                ]
            interval: 15s
            timeout: 10s
            retries: 10
        restart: unless-stopped

    kibana:
        image: docker.elastic.co/kibana/kibana:8.13.4
        ports:
            - "5601:5601"
        environment:
            ELASTICSEARCH_HOSTS: http://elasticsearch:9200
        depends_on:
            elasticsearch:
                condition: service_healthy
        restart: unless-stopped

    prometheus:
        image: prom/prometheus:v2.52.0
        ports:
            - "9090:9090"
        volumes:
            - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - prometheus_data:/prometheus
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--storage.tsdb.retention.time=15d"
        restart: unless-stopped

    grafana:
        image: grafana/grafana:10.4.3
        ports:
            - "3001:3000"
        environment:
            GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
            GF_USERS_ALLOW_SIGN_UP: "false"
        volumes:
            - grafana_data:/var/lib/grafana
            - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
            - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
        depends_on:
            - prometheus
        restart: unless-stopped

volumes:
    db_data:
    redis_data:
    kafka_data:
    es_data:
    prometheus_data:
    grafana_data:

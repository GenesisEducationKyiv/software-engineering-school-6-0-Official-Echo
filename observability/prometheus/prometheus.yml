global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ghchk
    static_configs:
      - targets: ["ghchk:3000"]
    metrics_path: /metrics
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
  - job_name: ghchk-scanner
    static_configs:
      - targets: ["scanner:9464"]
    metrics_path: /metrics
